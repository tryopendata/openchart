name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  ci:
    name: Build, lint, typecheck, test
    # Skip on release commits - publish job already runs build/typecheck/test
    if: "!startsWith(github.event.head_commit.message || '', 'release:')"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Build, lint, and typecheck
        run: |
          bun run lint &
          LINT_PID=$!
          bun run build || { echo "::error::Build failed"; exit 1; }
          wait $LINT_PID || { echo "::error::Lint failed"; exit 1; }
          bun run typecheck || { echo "::error::Typecheck failed"; exit 1; }

      - name: Test
        run: bun run test

  invariants:
    name: Playwright layout invariants
    if: "!startsWith(github.event.head_commit.message || '', 'release:')"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run invariants
        run: bunx playwright test --project=invariants --project=invariants-chromium-mobile --project=invariants-chromium-mobile-narrow

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
