name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  ci:
    name: Build, lint, typecheck, test
    # Skip on release commits - publish job already runs build/typecheck/test
    if: "!startsWith(github.event.head_commit.message || '', 'release:')"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Build, lint, typecheck, check generated
        run: |
          bun run lint &
          LINT_PID=$!
          bun run build || { echo "::error::Build failed"; exit 1; }
          wait $LINT_PID || { echo "::error::Lint failed"; exit 1; }
          bun run typecheck || { echo "::error::Typecheck failed"; exit 1; }
          # Fail if spec.ts changed without regenerating the schema / llms.txt
          # (runs after build: generate:llms imports the built core).
          bun run check:generated || { echo "::error::Generated schema or llms.txt is stale. Run: bun run generate"; exit 1; }

      - name: Test
        run: bun run test

  invariants:
    name: Playwright layout invariants
    if: "!startsWith(github.event.head_commit.message || '', 'release:')"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run invariants
        run: bunx playwright test --project=invariants --project=invariants-chromium-mobile --project=invariants-chromium-mobile-narrow

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
