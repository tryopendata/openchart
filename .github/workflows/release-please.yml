name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write
      pull-requests: write

    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      core_version: ${{ steps.release.outputs['packages/core--version'] }}

    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-bun
        with:
          node-version: '20'

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Rewrite workspace dependencies to real versions
        run: |
          VERSION="${{ needs.release-please.outputs.core_version }}"
          for pkg in packages/core packages/engine packages/vanilla packages/react packages/vue packages/svelte; do
            node -e "
              const fs = require('fs');
              const p = '$pkg/package.json';
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              for (const field of ['dependencies', 'peerDependencies', 'devDependencies']) {
                for (const [k, v] of Object.entries(j[field] || {})) {
                  if (v === 'workspace:*') j[field][k] = '${VERSION}';
                }
              }
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            "
          done

      - name: Verify no workspace references remain
        run: |
          if grep -r "workspace:" packages/*/package.json; then
            echo "ERROR: workspace: references found in package.json files"
            exit 1
          fi

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish_pkg() {
            local dir=$1
            echo "Publishing $dir..."
            output=$(npm publish --provenance --access public 2>&1) && echo "$output" && return 0
            if echo "$output" | grep -qi "previously published\|already exists\|cannot publish over"; then
              echo "Already published, skipping"
              return 0
            fi
            echo "$output" >&2
            return 1
          }
          for pkg in core engine vanilla react vue svelte; do
            (cd "packages/$pkg" && publish_pkg "$pkg")
          done
