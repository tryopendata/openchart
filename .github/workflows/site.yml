name: Site

# The documentation site (site/) and the parts of the repository it renders:
# the library packages, the repository docs and the example datasets. Cloudflare's
# Git integration builds and deploys the Pages project `openchart` on its own
# (site/AGENTS.md, Deploy); this workflow only checks. Release commits run too:
# a release changes the version the site shows.

on:
  push:
    branches: [main]
    paths: &site_paths
      - "site/**"
      - "docs/**"
      - "packages/**"
      - "examples/src/data/**"
      - "bun.lock"
      - "package.json"
      - "bunfig.toml"
      - ".github/workflows/site.yml"
      - ".github/actions/setup-bun/**"
  pull_request:
    paths: *site_paths
  workflow_dispatch:

permissions: {}

# One run per ref. A pull request run cancels the one it replaces; main never
# cancels, so every push to main gets its checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint, check, test, build and Pages checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-bun

      # The site resolves the library packages through their dist/.
      - name: Build library packages
        run: bun run build

      - name: Lint
        working-directory: site
        run: make lint

      - name: Type-check
        working-directory: site
        run: make check

      - name: Unit and component tests
        working-directory: site
        run: make test

      # No PostHog key here, so checks and previews send no analytics.
      - name: Build site and acceptance tests
        working-directory: site
        run: make build

      # -o build reuses the dist/ built above instead of building it again.
      - name: Pages headers, canonical URLs and 404
        working-directory: site
        run: make -o build deploy-check

  browser:
    # One shard per runner. scripts/e2e-shards.mjs splits the spec files by the
    # run times in e2e/shard-timings.json, so the shards finish together; refresh
    # them with `make e2e-timings` when they drift apart.
    name: Browser and accessibility tests (${{ matrix.shard }}/${{ strategy.job-total }})
    # The same runner image as the browser job in ci.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-bun

      # The site and the specs resolve the library packages through their dist/.
      - name: Build library packages
        run: bun run build

      # Each shard builds its own dist/: faster than waiting on a shared build job.
      - name: Build site
        working-directory: site
        run: bunx astro build

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-site-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-site-${{ runner.os }}-

      - name: Install Chromium
        working-directory: site
        run: bunx playwright install --with-deps chromium

      - name: Browser and accessibility tests
        working-directory: site
        env:
          E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: node scripts/e2e.mjs

      - name: Upload browser test output on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-playwright-report-${{ matrix.shard }}
          path: |
            site/playwright-report/
            site/test-results/
          retention-days: 7
          if-no-files-found: ignore
